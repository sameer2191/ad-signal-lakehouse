name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Run local demo
        run: python -m ad_signal_lakehouse demo --output runs/ci-demo --events 1000
